body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the implementation. 中文或 English 均可。
        An idea starts a conversation; it is not a delivery commitment.
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Who encounters this problem, and what do they need to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome / 期望结果
      description: Describe the behavior you would like and how success could be assessed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs / 替代方案与取舍
      description: Mention existing approaches, compatibility constraints and related discussions.
